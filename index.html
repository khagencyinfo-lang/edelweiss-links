<title>Edelweiss Resort & SPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;600&display=swap">
<style>
/* Layout: single phone-width column — mountain hero with edelweiss mark, link stack, request form, contacts. One committed alpine-night look. */
:root{
  --pine:#05231A;        /* brand forest green background */
  --pine-2:#0C3125;      /* raised surface */
  --line:#24493B;        /* hairlines, input borders */
  --snow:#F6F3EC;        /* primary text */
  --mist:#A8BCB2;        /* secondary text */
  --pollen:#DFBB8A;      /* brand champagne gold — the one accent */
  --ink:#05231A;         /* text on accent */
  --f-display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--pine);color:var(--snow);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding-inline:18px;padding-block:0 40px;display:flex;flex-direction:column;gap:28px}

/* hero */
.hero{position:relative;text-align:center;padding-block:40px 6px;display:flex;flex-direction:column;align-items:center;gap:12px}
.hero canvas{position:absolute;inset:0 -18px auto;width:calc(100% + 36px);height:230px;z-index:0;pointer-events:none}
.hero > *:not(canvas){position:relative;z-index:1}
.logo{margin:0;width:min(230px,62vw)}
.logo img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 24px rgba(0,0,0,.35))}
.mark{width:84px;height:84px;border-radius:50%;background:var(--pine-2);border:1px solid var(--line);display:grid;place-items:center}
.mark svg{width:58px;height:58px}
h1{font-family:var(--f-display);font-weight:400;font-size:2.05rem;line-height:1.1;margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
h1 span{display:block;font-family:var(--f-body);font-size:.72rem;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--pollen);margin-top:8px}
.place{color:var(--mist);font-size:.92rem;margin:0}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:4px;padding:0;list-style:none}
.facts li{font-size:.76rem;color:var(--mist);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.facts b{color:var(--snow);font-weight:600}

/* links */
.links{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--snow);background:var(--pine-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:transform .15s ease,border-color .15s ease}
.btn:hover{border-color:var(--mist);transform:translateY(-1px)}
.btn:focus-visible,.cta:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pollen);outline-offset:2px}
.btn svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn .t{display:flex;flex-direction:column;min-width:0;flex:1}
.btn .t b{font-weight:600;font-size:.98rem}
.btn .t small{color:var(--mist);font-size:.8rem}
.btn .arr{color:var(--mist);font-size:1.1rem}
.btn.main{background:var(--pollen);color:var(--ink);border-color:var(--pollen)}
.btn.main .t small,.btn.main .arr{color:#3d3220}

/* form */
.card{background:var(--pine-2);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:0;text-align:center}
.sub{color:var(--mist);text-align:center;margin:-8px 0 2px;font-size:.88rem}
form{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row > *{min-width:0}
label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
input,select{font:inherit;font-size:16px;color:var(--snow);background:var(--pine);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
input::placeholder{color:#6F8884}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-block;font-size:.85rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--snow);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.chips input:checked + span{background:var(--snow);color:var(--ink);border-color:var(--snow)}
.chips input:focus-visible + span{outline:2px solid var(--pollen);outline-offset:2px}
.cta{font:inherit;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.9rem;background:var(--pollen);color:var(--ink);border:0;border-radius:12px;padding:15px;cursor:pointer;margin-top:4px}
.cta:disabled{opacity:.6;cursor:wait}
.note{font-size:.78rem;color:var(--mist);text-align:center;margin:0}
.err{color:#F0A08C;font-size:.82rem;margin:0;text-align:center}
.done{text-align:center;display:flex;flex-direction:column;gap:6px;padding-block:10px}
.done strong{font-family:var(--f-display);font-weight:400;font-size:1.35rem}

/* contacts */
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contacts a,.contacts div{text-decoration:none;color:var(--snow);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.contacts small{color:var(--mist);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.contacts b{font-weight:600;font-size:.92rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
footer{text-align:center;color:#6F8884;font-size:.74rem}
@media (max-width:360px){.row,.contacts{grid-template-columns:1fr}}
/* ===== motion ===== */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes bloom{0%{opacity:0;transform:scale(.82) rotate(-8deg);filter:blur(6px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(320%) skewX(-20deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(223,187,138,.45)}70%{box-shadow:0 0 0 14px rgba(223,187,138,0)}100%{box-shadow:0 0 0 0 rgba(223,187,138,0)}}
@keyframes draw{to{stroke-dashoffset:0}}
.logo{position:relative;animation:bloom 1.1s cubic-bezier(.2,.8,.2,1) both}
.logo::before{content:"";position:absolute;inset:-6% 8% 38%;border-radius:50%;background:radial-gradient(closest-side,rgba(223,187,138,.35),transparent);z-index:-1;animation:glow 5s ease-in-out infinite}
.logo img{animation:float 6s ease-in-out 1.2s infinite}
.place{animation:rise .7s ease .5s both}
.facts li{animation:rise .6s ease both}
.facts li:nth-child(1){animation-delay:.65s}.facts li:nth-child(2){animation-delay:.75s}.facts li:nth-child(3){animation-delay:.85s}
.links .btn{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.9s + var(--i,0) * .08s)}
.btn svg{transition:transform .25s ease}
.btn:hover svg{transform:scale(1.15) rotate(-6deg)}
.btn .arr{transition:transform .25s ease}
.btn:hover .arr{transform:translateX(4px)}
.btn.main{position:relative;overflow:hidden;animation:rise .6s cubic-bezier(.2,.8,.2,1) .9s both,pulse 2.4s ease-out 2s infinite}
.btn.main::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s ease-in-out 1.8s infinite;pointer-events:none}
.card,.contacts{animation:rise .7s ease 1.5s both}
.card h2,.contacts{will-change:auto}
.cta{position:relative;overflow:hidden;transition:transform .15s ease,filter .15s ease}
.cta:hover{filter:brightness(1.06);transform:translateY(-1px)}
.cta:active{transform:scale(.98)}
.chips span{transition:background .2s ease,color .2s ease,transform .15s ease}
.chips input:checked + span{transform:scale(1.04)}
input,select{transition:border-color .2s ease,box-shadow .2s ease}
input:focus,select:focus{border-color:var(--pollen);box-shadow:0 0 0 3px rgba(223,187,138,.18)}
.done svg{width:64px;height:64px;margin:0 auto;stroke:var(--pollen);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.done svg circle{stroke-dasharray:160;stroke-dashoffset:160;animation:draw .7s ease forwards}
.done svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s ease .6s forwards}
.done strong,.done .note{animation:rise .5s ease .8s both}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>

/* drifting mountain ridges behind hero */
(function(){
  const c = document.getElementById("peaks"), x = c.getContext("2d");
  let w=0,h=0;
  function size(){ const r=devicePixelRatio||1; w=c.clientWidth; h=c.clientHeight; c.width=w*r; c.height=h*r; x.setTransform(r,0,0,r,0,0); }
  const layers=[{y:.55,a:.10,amp:60,seed:3,sp:.00004},{y:.72,a:.16,amp:40,seed:7,sp:.00009}];
  function frame(t){
    x.clearRect(0,0,w,h);
    layers.forEach(L=>{
      const off=t*L.sp;
      x.beginPath(); x.moveTo(0,h);
      for(let i=0;i<=w;i+=4){
        const s=i/w+off, v=Math.sin(s*5+L.seed)*.5+Math.sin(s*11+L.seed*2)*.3+Math.abs(Math.sin(s*3+L.seed))*.6;
        x.lineTo(i,h*L.y-v*L.amp*.7);
      }
      x.lineTo(w,h); x.closePath();
      const g=x.createLinearGradient(0,0,0,h); g.addColorStop(0,`rgba(246,243,236,${L.a})`); g.addColorStop(1,"rgba(246,243,236,0)");
      x.fillStyle=g; x.fill();
    });
    if(!still) requestAnimationFrame(frame);
  }
  size(); addEventListener("resize",size); requestAnimationFrame(frame);
})();

/* falling gold dust + snow over the whole page */
(function(){
  if(still) return;
  const c=document.getElementById("sky"), x=c.getContext("2d");
  let w=0,h=0,ps=[];
  function size(){ const r=devicePixelRatio||1; w=innerWidth; h=innerHeight; c.width=w*r; c.height=h*r; x.setTransform(r,0,0,r,0,0);
    const n=Math.round(Math.min(70,w*h/9000)); ps=Array.from({length:n},()=>mk(true)); }
  function mk(any){ return {x:Math.random()*w, y:any?Math.random()*h:-10, r:Math.random()*1.8+.4, vy:Math.random()*.35+.12,
    sw:Math.random()*2*Math.PI, ss:Math.random()*.01+.004, gold:Math.random()<.45, a:Math.random()*.5+.25}; }
  function frame(){
    x.clearRect(0,0,w,h);
    for(const p of ps){
      p.y+=p.vy; p.sw+=p.ss; p.x+=Math.sin(p.sw)*.3;
      if(p.y>h+10){ Object.assign(p,mk(false)); }
      x.beginPath(); x.arc(p.x,p.y,p.r,0,Math.PI*2);
      x.fillStyle=p.gold?`rgba(223,187,138,${p.a})`:`rgba(246,243,236,${p.a*.7})`;
      if(p.gold){ x.shadowColor="rgba(223,187,138,.8)"; x.shadowBlur=6; } else x.shadowBlur=0;
      x.fill();
    }
    requestAnimationFrame(frame);
  }
  size(); addEventListener("resize",size); requestAnimationFrame(frame);
})();

(function(){
  const els=document.querySelectorAll("section > h2");
  if(still || !("IntersectionObserver" in window)) return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }),{threshold:.2});
  els.forEach(el=>{ const r=el.getBoundingClientRect(); if(r.top>innerHeight){ el.classList.add("reveal"); io.observe(el);} });
})();

/* tap ripple on buttons */
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".btn,.cta"); if(!b||still) return;
  const r=b.getBoundingClientRect(), s=document.createElement("span"), d=Math.max(r.width,r.height)*2;
  s.style.cssText=`position:absolute;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px;width:${d}px;height:${d}px;border-radius:50%;background:rgba(255,255,255,.18);transform:scale(0);transition:transform .6s ease,opacity .6s ease;pointer-events:none`;
  if(getComputedStyle(b).position==="static") b.style.position="relative";
  b.style.overflow="hidden"; b.appendChild(s);
  requestAnimationFrame(()=>{ s.style.transform="scale(1)"; s.style.opacity="0"; });
  setTimeout(()=>s.remove(),650);
});
</script>
